<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <Table border="1"
        <caption style="text-align: center;">Food Menu</caption>
        <thead>
        <tr><th rowspan="2">Item</th>
            <th colspan="2">Cost</th>
            
        </tr>
        <tr><th>INR</th>
            <th>USD</th></tr>
        <tbody>
            
            <tr>
                <td>item1</td>
                <td>10</td>
                
                <td>100</td>

            </tr>
            <tr>
                <td>item2</td>
                <td>20</td>
                <td>200</td>
            </tr>
            <tfoot>
                <tr><td>Total</td>
                <td>30</td>
                <td>300</td>
            </tr>
            </tfoot>
        </tbody>
        </thead>
    </Table>
</body>
</html>
